<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shiftform</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #07070c; color: #f2f2f6; font-family: system-ui, sans-serif; overflow: hidden; }
    body { display: grid; place-items: center; }
    canvas { display: block; outline: none; image-rendering: auto; }
    #title { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 30%, #1d1a33, #07070c 70%); }
    #title[hidden] { display: none; }
    .card { text-align: center; max-width: 520px; padding: 32px; }
    h1 { font-size: 56px; letter-spacing: -0.03em; margin: 0 0 8px; }
    p { color: #a9a9bd; line-height: 1.5; margin: 0 0 24px; }
    .row { display: flex; gap: 8px; justify-content: center; }
    input { font: inherit; font-size: 18px; padding: 10px 14px; border-radius: 10px; border: 1px solid #3a3a55; background: #121222; color: inherit; width: 220px; }
    button { font: inherit; font-size: 18px; padding: 10px 18px; border-radius: 10px; border: 0; background: #ff5c8a; color: #10000a; font-weight: 700; cursor: pointer; }
    button.ghost { background: #26263a; color: #f2f2f6; }
    small { display: block; margin-top: 20px; color: #6f6f88; }
  </style>
</head>
<body>
  <canvas id="game" tabindex="0"></canvas>
  <div id="title">
    <div class="card">
      <h1>Shiftform</h1>
      <p>Every level rewrites the rules. Get from the left edge to the glowing gate on the right. Any seed is an endless, solvable, strange sequence of levels.</p>
      <div class="row">
        <input id="seed" placeholder="seed" autocomplete="off" spellcheck="false">
        <button id="play">Play</button>
        <button id="random" class="ghost">Random</button>
      </div>
      <small>Arrows / WASD move · Z or Space jump · X dash · R restart · H shows the solver's ghost · N skips</small>
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
