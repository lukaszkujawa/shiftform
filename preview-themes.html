<!doctype html>
<meta charset="utf-8">
<body style="margin:0;background:#111">
<canvas id="frame" hidden></canvas>
<canvas id="sheet"></canvas>
<script type="module">
import { createLevel, fillTiles, addObject, SOLID, ONE_WAY, TILE } from './src/level.js';
import { buildRules } from './src/rules.js';
import { createRenderer } from './src/render.js';
import { initialState } from './src/physics.js';
import { THEMES } from './src/themes.js';
import { WIDTH, HEIGHT } from './src/level.js';
function sample() {
  const level = createLevel(buildRules([]), [], 36);
  Object.assign(level, { index: 1, palette: Number(params.get('palette') ?? 200), segments: [], entryCol: 4, exit: { x: 0, y: -300, w: 0, h: 0 } });
  fillTiles(level, 0, 34, 32, 2, SOLID);
  for (const [c, r, w] of [[2, 30, 6], [11, 27, 4], [18, 24, 5], [25, 21, 5], [6, 21, 4], [13, 18, 6], [22, 14, 4], [2, 15, 5]]) fillTiles(level, c, r, w, 1, SOLID);
  fillTiles(level, 26, 28, 4, 3, SOLID);
  fillTiles(level, 9, 24, 3, 1, ONE_WAY);
  addObject(level, { type: 'crate', kind: 'wood', x: 13 * TILE + 1, y: 27 * TILE - 28, w: 28, h: 28 });
  addObject(level, { type: 'climb', x: 19 * TILE + 5, y: 18 * TILE, w: 20, h: 6 * TILE });
  addObject(level, { type: 'spikes', x: 20 * TILE + 3, y: 24 * TILE - 14, w: 24, h: 14, dir: -1 });
  addObject(level, { type: 'monster', kind: 'patroller', x: 2 * TILE, y: 30 * TILE - 20, w: 22, h: 20, dx: 150, dy: 0, period: 300, phase: 0 });
  addObject(level, { type: 'monster', kind: 'flapper', x: 9 * TILE, y: 22 * TILE, w: 22, h: 20, dx: 0, dy: 90, period: 240, phase: 30 });
  const spitter = addObject(level, { type: 'monster', kind: 'spitter', x: 17 * TILE, y: 18 * TILE - 20, w: 22, h: 20, dir: -1 });
  addObject(level, { type: 'shot', source: spitter.id, x: 17 * TILE - 10, y: 18 * TILE - 22, w: 10, h: 10, dir: -1, speed: 3.5, range: 180, period: 150, phase: 40 });
  level.start = { x: 4 * TILE, y: 30 * TILE - 26 };
  return level;
}
const params = new URLSearchParams(location.search);
const ids = (params.get('themes') || 'inferno,lunar,harbor,haunted,synthwave,factory,mushroom,sky').split(',');
const frame = document.getElementById('frame'), sheet = document.getElementById('sheet');
frame.width = WIDTH; frame.height = HEIGHT + 60;
const cols = 2, w = 640, h = 360;
sheet.width = cols * w; sheet.height = Math.ceil(ids.length / cols) * h;
const out = sheet.getContext('2d');
const base = sample();
const renderer = createRenderer(frame);
const keys = { left: false, right: false, jump: false, dash: false, interact: false, up: false, down: false };
ids.forEach((id, k) => {
  const level = { ...base, theme: THEMES.findIndex(t => t.id === id) };
  const state = initialState(level);
  const camera = Number(params.get('camera') ?? level.height - HEIGHT);
  for (let i = 0; i < 80; i++) renderer.draw({ level, state, time: 4000 + i * 16, seed: 'preview', camera, below: null, above: null, ghost: null, trail: [], particles: [], flash: 0, shake: 0, lives: 5, over: false, altitude: 300, best: 0, biomeIndex: 1, bannerAge: 1e9, touched: [], frozen: false, building: null, keys, muted: true, toast: null });
  out.drawImage(frame, 0, 0, WIDTH, HEIGHT, (k % cols) * w, Math.floor(k / cols) * h, w, h);
  out.fillStyle = '#fff'; out.font = '600 18px system-ui'; out.fillText(id, (k % cols) * w + 10, Math.floor(k / cols) * h + 24);
});
document.title = 'ready';
</script>
