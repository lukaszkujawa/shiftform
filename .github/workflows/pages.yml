name: Pages
on:
  push:
    branches: [master]
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "export const VERSION = '$(git log -1 --format=%cd --date=format:%Y-%m-%d) · ${GITHUB_SHA::7}';" > src/version.js
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          exclude_assets: .github,test,docs,node_modules
